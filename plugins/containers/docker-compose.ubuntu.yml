services:
  pi:
    stdin_open: true
    tty: true
    command: /bin/bash
    build:
      context: .
      dockerfile: DockerfilePi
    ports:
      - "80:80"
    volumes:
      - ~/.workspace:/root/.workspace

  home:
    stdin_open: true
    tty: true
    command: /bin/bash
    build:
      context: .
      dockerfile: DockerfileU22
    volumes:
      - ~/.workspace:/root/.workspace

  maya:
    stdin_open: true
    tty: true
    command: /bin/bash
    build:
      context: .
      dockerfile: DockerFileUbuntuServer
    ports:
      - "8000:8000"
    volumes:
      - ~/.workspace:/root/.workspace

  maya-gpu:
    stdin_open: true
    tty: true
    command: /bin/bash
    build:
      context: .
      dockerfile: DockerFileUbuntuServer
    ports:
      - "8000:8000"
    volumes:
      - ~/.workspace:/root/.workspace
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            capabilities: [ gpu, video ]

